name: Android CI
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "Android SDK command-line tools missing at $SDKMANAGER"; exit 1; }
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Validate JSON benchmark schema
        run: |
          python3 -m pip install --user "jsonschema>=4.18,<5"
          python3 scripts/validate_benchmarks.py
      - name: Kotlin JVM and vehicle state tests plus Android Debug APK
        run: gradle --no-daemon :core:model:test :core:navigation:test :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: navigation-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
