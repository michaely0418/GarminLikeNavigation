name: Stage 2 PoC Preflight
on:
  pull_request:
    paths:
      - 'routing-poc/**'
      - 'docs/STAGE2_POC_PLAN.md'
      - '.github/workflows/stage2-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python offline smoke parser unit tests
        run: python3 -m unittest discover -s routing-poc/tests -p 'test_*.py' -v
      - name: Parse official Valhalla local-only Docker Compose
        run: |
          cp routing-poc/.env.example routing-poc/.env
          docker compose -f routing-poc/compose.valhalla.yml config --quiet
      - name: Confirm no routing engine or real road-law compliance was assumed
        run: |
          echo 'Preflight checks syntax and parser only; no container, OSM import, route call, or legal certification is run.'
