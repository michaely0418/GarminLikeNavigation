# Stage 2 Synology Container Manager - Project directory example:
# /volume1/docker/garmin-routing/graphhopper
# Prerequisites: ./data/taiwan.osm.pbf and ./data/graphhopper-web-11.1.jar
# GraphHopper 11.1 upstream Java 25 JAR; config.yml derived from upstream 11.x.
# WARNING: this is a generic 'car' route PoC, NOT Taiwan law compliant.
services:
  graphhopper:
    image: eclipse-temurin:25-jre
    platform: linux/amd64
    working_dir: /data
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - ./data:/data
      - ./graphhopper-config.yml:/config/graphhopper-config.yml:ro
    command:
      - java
      - -Xms1g
      - -Xmx8g
      - -Ddw.graphhopper.datareader.file=/data/taiwan.osm.pbf
      - -Ddw.graphhopper.graph.location=/data/graph-cache
      - -jar
      - /data/graphhopper-web-11.1.jar
      - server
      - /config/graphhopper-config.yml
    # Synology DSM kernel on this NAS rejects Docker NanoCPUs/CFS quotas.
    # Avoid cpus/cpu_quota/deploy.resources.limits.cpus; no hard CPU cap is set.
    # Run only one routing engine at a time and monitor host CPU usage.
    # Owner DSM screenshot: 64 GB installed (above the official 32 GB listed maximum).
    # Allow 8 GB heap within an exploratory 12 GB container limit; monitor actual RSS.
    # Never run this benchmark concurrently with Valhalla during first-pass comparison.
    mem_limit: 12g
    restart: "no"
