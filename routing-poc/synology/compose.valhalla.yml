# Stage 2 Synology Container Manager - Project directory example:
# /volume1/docker/garmin-routing/valhalla
# Create ./data/ and put SAME taiwan.osm.pbf snapshot as GraphHopper there.
# WARNING: no legal road checks and no connection to Android app.
services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    platform: linux/amd64
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./data:/custom_files
    environment:
      server_threads: "2"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      build_tar: "True"
      use_tiles_ignore_pbf: "False"
      force_rebuild: "False"
      serve_tiles: "True"
    # Synology DSM kernel on this NAS rejects Docker NanoCPUs/CFS quotas.
    # Do not add cpus/cpu_quota/deploy.resources.limits.cpus here.
    # server_threads=2 reduces Valhalla worker concurrency but is NOT a hard CPU cap.
    # DS1621xs+: DSM reports 64 GB physically installed (above Synology's published 32 GB limit).
    # Preliminary 12 GB sandbox cap, NOT an observed engine memory requirement.
    # Start one routing engine at a time; keep headroom for DSM and other services.
    mem_limit: 12g
    restart: "no"
