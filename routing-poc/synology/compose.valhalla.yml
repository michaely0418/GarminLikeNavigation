# Stage 2 Synology Container Manager - Project directory example:
# /volume1/docker/garmin-routing/valhalla
# Create ./data/ and put SAME taiwan.osm.pbf snapshot as GraphHopper there.
# WARNING: no legal road checks and no connection to Android app.
services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    platform: linux/amd64
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - ./data:/custom_files
    environment:
      server_threads: "2"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      build_tar: "True"
      use_tiles_ignore_pbf: "False"
      force_rebuild: "False"
      serve_tiles: "True"
    cpus: 2.0
    # Only for hosts with >=16 GB total RAM: tune after checking NAS memory.
    mem_limit: 6g
    restart: "no"
